<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafe Barista – POS Login</title>
  <!-- Poppins Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Floating Notification (top pop-up) -->
  <div id="notification" class="notification"></div>

  <div class="login-container">
    <div class="login-box">
      <h1 class="brand">Cafe Barista</h1>

      <div class="field">
        <label for="role">ROLE</label>
        <select id="role">
          <option value="Admin">Admin</option>
          <option value="Cashier" selected>Cashier</option>
          <option value="Kitchen">Kitchen</option>
        </select>
      </div>

      <div class="field">
        <label for="username">USERNAME</label>
        <input type="text" id="username" value="cashier" placeholder="Enter username" />
      </div>

      <div class="field">
        <label for="pin">PIN</label>
        <input type="password" id="pin" value="1234" placeholder="•••" maxlength="6" />
      </div>

      <button id="signInBtn">Sign In</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
